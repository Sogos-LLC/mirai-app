# Persistent Volume Claim for Qdrant vector storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: mirai-local-dev
  labels:
    app: qdrant
    environment: dev
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
