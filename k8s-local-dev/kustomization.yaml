apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev Environment Root Kustomization
# This aggregates all dev resources for deployment via ArgoCD
# NOTE: No global namespace - each sub-kustomization handles its own namespace

resources:
# Infrastructure (creates mirai-local-dev, kratos-local-dev, redis-local-dev namespaces)
- namespace.yaml
- networkpolicies.yaml

# Application tiers (each has own kustomization that patches the base k8s/ manifests)
- backend
- frontend
- frontend-marketing

# RAG Infrastructure (vector database)
- qdrant

# AI Service (Temporal worker + pydantic-ai agents)
- temporal
- ai

# Common labels for all dev resources
labels:
- pairs:
    environment: dev
  includeSelectors: false
