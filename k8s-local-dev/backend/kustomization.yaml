apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-loc-dev

resources:
- ../../k8s/backend

# Override labels for dev
labels:
- pairs:
    environment: dev

# Strategic merge patches for dev configuration
# Using target selectors to handle namespace transformation

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/dnsConfig/searches
      value:
        - mirai-loc-dev.svc.cluster.local
        - svc.cluster.local
        - cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mirai-loc-dev-db-secret
              key: dsn
        - name: KRATOS_URL
          value: "http://kratos-public.kratos-loc-dev.svc.cluster.local"
        - name: KRATOS_ADMIN_URL
          value: "http://kratos-admin.kratos-loc-dev.svc.cluster.local"
        - name: ALLOWED_ORIGIN
          value: "https://mirai-dev.sogos.io"
        - name: FRONTEND_URL
          value: "https://mirai-dev.sogos.io"
        - name: MARKETING_URL
          value: "https://get-mirai-dev.sogos.io"
        - name: BACKEND_URL
          value: "https://mirai-api-dev.sogos.io"
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mirai-loc-dev-stripe-secret
              key: secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: mirai-loc-dev-stripe-secret
              key: webhook-secret
        - name: STRIPE_STARTER_PRICE_ID
          valueFrom:
            secretKeyRef:
              name: mirai-loc-dev-stripe-secret
              key: starter-price-id
        - name: STRIPE_PRO_PRICE_ID
          valueFrom:
            secretKeyRef:
              name: mirai-loc-dev-stripe-secret
              key: pro-price-id
        - name: SMTP_HOST
          value: "mailpit.default.svc.cluster.local"
        - name: SMTP_PORT
          value: "1025"
        - name: SMTP_FROM
          value: "noreply-dev@mirai.sogos.io"
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: endpoint
        - name: S3_REGION
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: region
        - name: S3_BUCKET
          value: "mirai-dev"
        - name: S3_BASE_PATH
          value: "data"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: accesskey
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: secretkey
        - name: S3_PUBLIC_ENDPOINT
          value: "https://minio.sogos.io"
        - name: GIN_MODE
          value: "release"
        - name: QDRANT_URL
          value: "http://qdrant.mirai-loc-dev.svc.cluster.local:6333"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: mirai-loc-dev-encryption-secret
              key: encryption-key
        - name: REDIS_URL
          value: "redis://redis.redis-loc-dev.svc.cluster.local:6379"
        - name: TWENTY_API_URL
          value: "https://crm.sogos.io"
        - name: TWENTY_API_KEY
          valueFrom:
            secretKeyRef:
              name: twenty-credentials
              key: api-key
        - name: TEMPORAL_ADDRESS
          value: "temporal-server.mirai-loc-dev.svc.cluster.local:7233"
        - name: TEMPORAL_NAMESPACE
          value: "mirai-loc-dev"
        - name: LOGFIRE_TOKEN
          valueFrom:
            secretKeyRef:
              name: logfire-dev
              key: token
              optional: true
  target:
    kind: Deployment
    name: mirai-backend
- patch: |-
    - op: replace
      path: /spec/template/spec/dnsConfig/searches
      value:
        - mirai-loc-dev.svc.cluster.local
        - svc.cluster.local
        - cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mirai-loc-dev-db-secret
              key: dsn
  target:
    kind: Job
    name: mirai-db-migrate
- patch: |-
    - op: replace
      path: /spec/maxUnavailable
      value: 1
  target:
    kind: PodDisruptionBudget
    name: mirai-backend-pdb
- patch: |-
    - op: replace
      path: /spec/egress/0/to/0/namespaceSelector/matchLabels
      value:
        kubernetes.io/metadata.name: kratos-loc-dev
  target:
    kind: NetworkPolicy
    name: allow-egress-to-kratos
- patch: |-
    - op: replace
      path: /spec/egress/0/to/0/namespaceSelector/matchLabels
      value:
        kubernetes.io/metadata.name: redis-loc-dev
  target:
    kind: NetworkPolicy
    name: allow-egress-to-redis

images:
- name: ghcr.io/sogos-llc/mirai-app/mirai-backend
  newName: ghcr.io/sogos-llc/mirai-app/mirai-backend
  newTag: dev-a8c0a78
