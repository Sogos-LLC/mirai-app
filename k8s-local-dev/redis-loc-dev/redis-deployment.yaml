# Redis deployment for dev environment
# Single instance, minimal resources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis-loc-dev
  labels:
    app: redis
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        environment: dev
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /etc/redis/redis.conf
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: redis-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis-loc-dev
  labels:
    environment: dev
data:
  redis.conf: |
    # Redis configuration for dev
    maxmemory 128mb
    maxmemory-policy allkeys-lru

    # Persistence - disabled for dev (ephemeral data)
    save ""
    appendonly no

    # Networking
    bind 0.0.0.0
    protected-mode no
    port 6379

    # Connections
    databases 16

    # Keyspace notifications for cache invalidation
    notify-keyspace-events Ex
