[project]
name = "mirai-ai-service"
version = "0.1.0"
description = "Mirai AI Service - Temporal activity worker for AI course generation"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai[google]>=1.0.0",
    "pydantic-graph>=0.1.0",
    "fasta2a>=0.6.0",
    "temporalio>=1.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.27.0",
    "logfire[fastapi]>=3.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pydantic-evals>=0.1.0",
    "asgi-lifespan>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
