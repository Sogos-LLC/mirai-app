apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirai-marketing
spec:
  # Single replica for local development
  replicas: 1

  # Remove production-specific constraints
  minReadySeconds: 5

  template:
    spec:
      # Remove production tolerations and topology constraints for local k3d
      tolerations: null
      topologySpreadConstraints: null

      containers:
      - name: mirai-marketing
        # Use local images with Never pull policy
        imagePullPolicy: Never

        # Resources for local development
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Override environment variables for local development
        env:
        # Ory Kratos authentication configuration (local URLs for redirects)
        - name: NEXT_PUBLIC_KRATOS_BROWSER_URL
          value: "https://auth.mirai.test"
        - name: NEXT_PUBLIC_APP_URL
          value: "https://mirai.test"
        - name: NEXT_PUBLIC_LANDING_URL
          value: "https://get-mirai.test"

        # Faster startup probes for local development
        startupProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 10

        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 2
