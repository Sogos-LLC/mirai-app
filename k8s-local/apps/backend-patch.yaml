apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirai-backend
spec:
  # Single replica for local development
  replicas: 1

  # Remove production-specific constraints
  minReadySeconds: 5

  template:
    spec:
      # Remove production tolerations and topology constraints for local k3d
      tolerations: null
      topologySpreadConstraints: null

      # Simplified DNS for local k3d cluster
      dnsPolicy: ClusterFirst
      dnsConfig: null

      # Init containers to wait for dependencies before backend starts
      # This prevents the "DNS lookup failed" errors during cluster startup
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL DNS..."
          until nslookup mirai-db-rw.mirai-local.svc.cluster.local > /dev/null 2>&1; do
            echo "  DNS not ready, retrying in 2s..."
            sleep 2
          done
          echo "PostgreSQL DNS resolved, checking TCP connectivity..."
          until nc -z mirai-db-rw.mirai-local.svc.cluster.local 5432; do
            echo "  PostgreSQL not accepting connections, retrying in 2s..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for Redis DNS..."
          until nslookup redis.mirai-local.svc.cluster.local > /dev/null 2>&1; do
            echo "  DNS not ready, retrying in 2s..."
            sleep 2
          done
          echo "Redis DNS resolved, checking TCP connectivity..."
          until nc -z redis.mirai-local.svc.cluster.local 6379; do
            echo "  Redis not accepting connections, retrying in 2s..."
            sleep 2
          done
          echo "Redis is ready!"
      - name: wait-for-kratos
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for Kratos DNS..."
          until nslookup kratos-public.mirai-local.svc.cluster.local > /dev/null 2>&1; do
            echo "  DNS not ready, retrying in 2s..."
            sleep 2
          done
          echo "Kratos DNS resolved, checking TCP connectivity..."
          until nc -z kratos-public.mirai-local.svc.cluster.local 4433; do
            echo "  Kratos not accepting connections, retrying in 2s..."
            sleep 2
          done
          echo "Kratos is ready!"

      containers:
      - name: backend
        # Use local images with Never pull policy
        imagePullPolicy: Never

        # Resources for local development (increased for better performance)
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        # Override environment variables for local development
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mirai-db-secret
              key: dsn
        - name: KRATOS_URL
          value: "http://kratos-public.mirai-local.svc.cluster.local:4433"
        - name: KRATOS_ADMIN_URL
          value: "http://kratos-admin.mirai-local.svc.cluster.local:4434"
        - name: ALLOWED_ORIGIN
          value: "https://mirai.dev"
        - name: FRONTEND_URL
          value: "https://mirai.dev"
        - name: MARKETING_URL
          value: "https://get-mirai.dev"
        - name: BACKEND_URL
          value: "https://api.mirai.dev"
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mirai-stripe-secret
              key: secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: mirai-stripe-secret
              key: webhook-secret
        - name: STRIPE_STARTER_PRICE_ID
          valueFrom:
            secretKeyRef:
              name: mirai-stripe-secret
              key: starter-price-id
        - name: STRIPE_PRO_PRICE_ID
          valueFrom:
            secretKeyRef:
              name: mirai-stripe-secret
              key: pro-price-id
        - name: SMTP_HOST
          value: "mailpit.mirai-local.svc.cluster.local"
        - name: SMTP_PORT
          value: "1025"
        - name: SMTP_FROM
          value: "noreply@mirai.dev"
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: endpoint
        - name: S3_REGION
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: region
        - name: S3_BUCKET
          value: "mirai"
        - name: S3_BASE_PATH
          value: "data"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: accesskey
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: secretkey
        - name: REDIS_URL
          value: "redis://redis.mirai-local.svc.cluster.local:6379"
        - name: GIN_MODE
          value: "debug"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: mirai-encryption-secret
              key: encryption-key
        # Trust mkcert CA for internal HTTPS calls to *.mirai.dev
        - name: SSL_CERT_FILE
          value: "/etc/ssl/certs/mkcert-ca.pem"

        # Mount mkcert CA certificate
        volumeMounts:
        - name: mkcert-ca
          mountPath: /etc/ssl/certs/mkcert-ca.pem
          subPath: rootCA.pem
          readOnly: true

        # Faster startup probes for local development
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5

      # Volumes for mkcert CA certificate
      volumes:
      - name: mkcert-ca
        configMap:
          name: mkcert-ca
