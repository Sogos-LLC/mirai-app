---
# Local development network policy - allows all egress
# This replaces the restrictive production policies that block DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress-local
  namespace: mirai-local
  labels:
    environment: local
spec:
  podSelector: {}  # Applies to all pods in namespace
  policyTypes:
  - Egress
  egress:
  - {}  # Allow all egress traffic
