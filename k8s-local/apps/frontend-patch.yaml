apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirai-frontend
spec:
  # Single replica for local development
  replicas: 1

  # Remove production-specific constraints
  minReadySeconds: 5

  template:
    spec:
      # Remove production tolerations and topology constraints for local k3d
      tolerations: null
      topologySpreadConstraints: null

      containers:
      - name: mirai-frontend
        # Use local images with Never pull policy
        imagePullPolicy: Never

        # Resources for local development (increased for better performance)
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        # Override environment variables for local development
        # Note: S3_ENDPOINT must use value (not valueFrom) to override production's value
        # Using valueFrom would cause a conflict in strategic merge patch
        env:
        # MinIO configuration (local)
        - name: USE_S3_STORAGE
          value: "true"
        - name: S3_ENDPOINT
          value: "http://minio.mirai-local.svc.cluster.local:9000"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: accesskey
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: secretkey
        - name: S3_BUCKET
          value: "mirai"
        - name: S3_REGION
          value: "us-east-1"
        - name: S3_BASE_PATH
          value: "data"
        # Redis caching configuration
        - name: ENABLE_REDIS_CACHE
          value: "true"
        - name: REDIS_URL
          value: "redis://redis.mirai-local.svc.cluster.local:6379"
        # Ory Kratos authentication configuration (local URLs)
        - name: KRATOS_PUBLIC_URL
          value: "http://kratos-public.mirai-local.svc.cluster.local:4433"
        - name: NEXT_PUBLIC_KRATOS_BROWSER_URL
          value: "https://auth.mirai.dev"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.mirai.dev"
        - name: NEXT_PUBLIC_APP_URL
          value: "https://mirai.dev"
        - name: NEXT_PUBLIC_LANDING_URL
          value: "https://get-mirai.dev"
        # Development mode to prevent production redirects
        - name: NODE_ENV
          value: "development"

        # Faster startup probes for local development
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 10

        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
