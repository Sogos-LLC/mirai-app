---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mirai-local
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mirai
    app.kubernetes.io/environment: local
data:
  init-databases.sql: |
    -- Init script for local PostgreSQL
    -- Creates databases for both Mirai and Kratos

    -- Create Mirai database (if not exists - will be default POSTGRES_DB)
    SELECT 'CREATE DATABASE mirai'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mirai')\gexec

    -- Create Kratos database for Ory Kratos authentication
    SELECT 'CREATE DATABASE kratos'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'kratos')\gexec

    -- Connect to mirai database and create extensions
    \c mirai
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Connect to kratos database (extensions created by Kratos migrations)
    \c kratos
