---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-local

resources:
  # Secrets (LOCAL DEV ONLY - not for production)
  - secrets.yaml

  # PostgreSQL: Using CloudNativePG (CNPG) instead - see setup.sh

  # Redis
  - redis/deployment.yaml
  - redis/service.yaml

  # MinIO
  - minio/pvc.yaml
  - minio/deployment.yaml
  - minio/service.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/environment: local
    includeSelectors: false
