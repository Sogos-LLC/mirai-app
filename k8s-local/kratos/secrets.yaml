# Kratos Secrets - LOCAL DEV ONLY
# WARNING: These are placeholder values for local development only.
# DO NOT use these values in production.

apiVersion: v1
kind: Secret
metadata:
  name: kratos-secret
  namespace: mirai
  labels:
    app: kratos
    environment: local
type: Opaque
stringData:
  # PostgreSQL connection string for Kratos database
  dsn: "postgres://postgres:local-dev-password-postgres-change-me@mirai-db.mirai.svc.cluster.local:5432/kratos?sslmode=disable"

  # Session encryption secret (must be 32 characters)
  # Generated with: openssl rand -base64 32
  # LOCAL DEV ONLY - generate new secret for production
  secretsDefault: "localdevsecret32characterlong!!"
