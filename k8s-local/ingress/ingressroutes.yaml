---
# Frontend: mirai.local
# Routes to the main Mirai application (Next.js frontend)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mirai-frontend
  namespace: mirai
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mirai.local`)
      kind: Rule
      services:
        - name: mirai-frontend
          port: 80
      middlewares:
        - name: security-headers
  tls:
    secretName: mirai-local-tls

---
# Marketing Site: get-mirai.local
# Routes to the marketing/landing page (Next.js marketing frontend)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mirai-marketing
  namespace: mirai
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`get-mirai.local`)
      kind: Rule
      services:
        - name: mirai-marketing
          port: 80
      middlewares:
        - name: security-headers
  tls:
    secretName: mirai-local-tls

---
# Backend API: api.mirai.local
# Routes to the Connect-RPC backend service
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mirai-backend
  namespace: mirai
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.mirai.local`)
      kind: Rule
      services:
        - name: mirai-backend
          port: 8080
      middlewares:
        - name: api-cors
        - name: security-headers
  tls:
    secretName: mirai-local-tls

---
# Kratos Public API: auth.mirai.local
# Routes to Ory Kratos authentication service (public endpoint)
# Note: Kratos is deployed via Helm and creates its own service
# The service name follows the pattern: <release-name>-public
# Assuming release name is "kratos" in the "kratos" namespace
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kratos-public
  namespace: mirai
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.mirai.local`)
      kind: Rule
      services:
        # Cross-namespace service reference
        # Format: service-name.namespace.svc.cluster.local
        # Kratos Helm chart creates service named "<release>-public"
        - name: kratos-public
          namespace: kratos
          port: 80
      middlewares:
        - name: kratos-cors
        - name: security-headers
  tls:
    secretName: mirai-local-tls

---
# HTTP to HTTPS redirect for all hosts
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-redirect
  namespace: mirai
spec:
  entryPoints:
    - web
  routes:
    - match: HostRegexp(`{host:.+}`)
      kind: Rule
      services:
        # Dummy service - will never be reached due to redirect
        - name: mirai-frontend
          port: 80
      middlewares:
        - name: https-redirect
