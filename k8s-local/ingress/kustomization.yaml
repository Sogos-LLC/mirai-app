apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-local

resources:
  - middleware.yaml
  - ingressroutes.yaml

# Note: tls-secret.yaml.template is NOT included here
# The TLS secret must be created manually using mkcert
# See tls-secret.yaml.template for instructions

# Note: traefik-values.yaml is NOT included here
# It's used with Helm installation:
# helm install traefik traefik/traefik -f traefik-values.yaml -n kube-system
