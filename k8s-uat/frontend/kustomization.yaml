apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-uat

resources:
- ../../k8s/frontend

# Override labels for UAT
labels:
- pairs:
    environment: uat
  includeSelectors: false

# Strategic merge patches for UAT configuration
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mirai-frontend
    spec:
      replicas: 2
      template:
        spec:
          containers:
          - name: mirai-frontend
            env:
            - name: S3_BUCKET
              value: "mirai-uat"
            - name: REDIS_URL
              value: "redis://redis.redis-uat.svc.cluster.local:6379"
            - name: KRATOS_PUBLIC_URL
              value: "http://kratos-public.kratos-uat.svc.cluster.local:80"
            - name: NEXT_PUBLIC_KRATOS_BROWSER_URL
              value: "https://mirai-auth-uat.sogos.io"
            - name: NEXT_PUBLIC_API_URL
              value: "https://mirai-api-uat.sogos.io"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://mirai-uat.sogos.io"
            - name: NEXT_PUBLIC_LANDING_URL
              value: "https://get-mirai-uat.sogos.io"

- patch: |-
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: mirai-frontend-pdb
    spec:
      maxUnavailable: 1

images:
- name: ghcr.io/sogos-llc/mirai-app/mirai-frontend
  newName: ghcr.io/sogos-llc/mirai-app/mirai-frontend
  newTag: uat-latest
