# Embedding Service for RAG
# Stateless FastAPI service using sentence-transformers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding
  namespace: mirai-uat
  labels:
    app: embedding
    environment: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding
  template:
    metadata:
      labels:
        app: embedding
        environment: uat
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: embedding
        image: ghcr.io/sogos-llc/mirai-app/embedding-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MODEL_NAME
          value: "all-MiniLM-L6-v2"
        - name: MAX_BATCH_SIZE
          value: "64"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "2Gi"
            cpu: "2000m"
          limits:
            memory: "4Gi"
            cpu: "3000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Model cache needs write access
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
