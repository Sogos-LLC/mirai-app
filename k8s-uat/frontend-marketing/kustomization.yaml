apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-uat

resources:
- ../../k8s/frontend-marketing

# Override labels for UAT
labels:
- pairs:
    environment: uat
  includeSelectors: false

# Strategic merge patches for UAT configuration
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mirai-marketing
    spec:
      replicas: 2
      template:
        spec:
          containers:
          - name: mirai-marketing
            env:
            - name: NEXT_PUBLIC_KRATOS_BROWSER_URL
              value: "https://mirai-auth-uat.sogos.io"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://mirai-uat.sogos.io"
            - name: NEXT_PUBLIC_LANDING_URL
              value: "https://get-mirai-uat.sogos.io"

- patch: |-
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: mirai-marketing-pdb
    spec:
      maxUnavailable: 1

images:
- name: ghcr.io/sogos-llc/mirai-app/mirai-marketing
  newName: ghcr.io/sogos-llc/mirai-app/mirai-marketing
  newTag: uat-latest
