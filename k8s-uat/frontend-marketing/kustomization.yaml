apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-uat

resources:
- ../../k8s/frontend-marketing

# Use JSON patches for environment variable overrides
# Env var indices: 0=NEXT_PUBLIC_KRATOS_BROWSER_URL, 1=NEXT_PUBLIC_APP_URL,
#                  2=NEXT_PUBLIC_LANDING_URL
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "https://mirai-uat.sogos.io"
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: "https://get-mirai-uat.sogos.io"
  target:
    kind: Deployment
    name: mirai-marketing

# Override image tag (will be updated by GitHub Actions)
images:
- name: ghcr.io/sogos-llc/mirai-app/mirai-marketing
  newName: ghcr.io/sogos-llc/mirai-app/mirai-marketing
  newTag: uat-10d9398
