apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-uat

resources:
- ../../k8s/backend

# Override labels for UAT
labels:
- pairs:
    environment: uat
  includeSelectors: false

# Strategic merge patch for deployment - more robust than JSON patch
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mirai-backend
    spec:
      replicas: 2
      template:
        spec:
          dnsConfig:
            searches:
              - mirai-uat.svc.cluster.local
              - svc.cluster.local
              - cluster.local
          containers:
          - name: backend
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mirai-uat-db-secret
                  key: dsn
            - name: KRATOS_URL
              value: "http://kratos-public.kratos-uat.svc.cluster.local"
            - name: KRATOS_ADMIN_URL
              value: "http://kratos-admin.kratos-uat.svc.cluster.local"
            - name: ALLOWED_ORIGIN
              value: "https://mirai-uat.sogos.io"
            - name: FRONTEND_URL
              value: "https://mirai-uat.sogos.io"
            - name: MARKETING_URL
              value: "https://get-mirai-uat.sogos.io"
            - name: BACKEND_URL
              value: "https://mirai-api-uat.sogos.io"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mirai-uat-stripe-secret
                  key: secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mirai-uat-stripe-secret
                  key: webhook-secret
            - name: STRIPE_STARTER_PRICE_ID
              valueFrom:
                secretKeyRef:
                  name: mirai-uat-stripe-secret
                  key: starter-price-id
            - name: STRIPE_PRO_PRICE_ID
              valueFrom:
                secretKeyRef:
                  name: mirai-uat-stripe-secret
                  key: pro-price-id
            - name: SMTP_FROM
              value: "noreply-uat@mirai.sogos.io"
            - name: S3_BUCKET
              value: "mirai-uat"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: mirai-uat-encryption-secret
                  key: encryption-key

# Patch migration job for UAT
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: mirai-db-migrate
    spec:
      template:
        spec:
          dnsConfig:
            searches:
              - mirai-uat.svc.cluster.local
              - svc.cluster.local
              - cluster.local
          containers:
          - name: migrate
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mirai-uat-db-secret
                  key: dsn

# Patch PDB for fewer replicas
- patch: |-
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: mirai-backend-pdb
    spec:
      maxUnavailable: 1

# Patch network policies for UAT namespaces
- patch: |-
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-egress-to-kratos
    spec:
      egress:
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kratos-uat
        ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4433
        - protocol: TCP
          port: 4434

- patch: |-
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-egress-to-redis
    spec:
      egress:
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-uat
        ports:
        - protocol: TCP
          port: 6379

images:
- name: ghcr.io/sogos-llc/mirai-app/mirai-backend
  newName: ghcr.io/sogos-llc/mirai-app/mirai-backend
  newTag: uat-latest
