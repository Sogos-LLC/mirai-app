apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mirai-uat

resources:
- ../../k8s/backend

# Use JSON patches for environment variable overrides
# Env var indices: 0=PORT, 1=DATABASE_URL, 2=KRATOS_URL, 3=KRATOS_ADMIN_URL,
#                  4=ALLOWED_ORIGIN, 5=FRONTEND_URL, 6=MARKETING_URL, 7=BACKEND_URL
patches:
- target:
    kind: Rollout
    name: mirai-backend
    group: argoproj.io
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/dnsConfig/searches/0
      value: mirai-uat.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/env/1/valueFrom/secretKeyRef/name
      value: mirai-uat-db-secret
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "https://mirai-uat.sogos.io"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "https://mirai-uat.sogos.io"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "https://mirai-uat-api.sogos.io"
# Patch migration job to use UAT database secret
- target:
    kind: Job
    name: mirai-db-migrate
  patch: |-
    - op: replace
      path: /spec/template/spec/dnsConfig/searches/0
      value: mirai-uat.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
      value: mirai-uat-db-secret

# Override image tag (will be updated by GitHub Actions)
images:
- name: ghcr.io/sogos-llc/mirai-app/mirai-backend
  newName: ghcr.io/sogos-llc/mirai-app/mirai-backend
  newTag: bc9ee8b
