# CloudNativePG Cluster for Mirai UAT Database
# Single instance, minimal resources, no backups (test data is ephemeral)
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mirai-uat-db
  namespace: mirai-uat
  labels:
    app.kubernetes.io/name: mirai-uat-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mirai-uat
    environment: uat
spec:
  description: "Mirai UAT Database - Single instance for testing"
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # Single instance - no HA for UAT (cost savings)
  instances: 1

  # PostgreSQL configuration - minimal for UAT
  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      max_connections: "50"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
    pg_hba:
      - host all all 10.0.0.0/8 scram-sha-256
      - host all all 192.168.0.0/16 scram-sha-256

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: mirai
      owner: mirai
      encoding: UTF8
      secret:
        name: mirai-uat-db-credentials
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"

  # Storage configuration - minimal for UAT
  storage:
    storageClass: local-path
    size: 5Gi

  # WAL storage
  walStorage:
    storageClass: local-path
    size: 2Gi

  # Resource allocation - minimal for UAT
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  # Affinity - allow scheduling on control plane
  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Disable superuser access
  enableSuperuserAccess: false

  # No backup configuration for UAT - test data is ephemeral
