syntax = "proto3";

package mirai.v1;

import "google/protobuf/timestamp.proto";
import "mirai/v1/component_enums.proto";
import "mirai/v1/course_wizard.proto";

// =============================================================================
// AI GENERATION TYPES - Jobs, Outlines, and Generated Lessons
// =============================================================================
//
// To regenerate after changes: cd proto && buf generate
// For help: buf generate --help
// =============================================================================

// GenerationJobType represents the type of AI generation job.
enum GenerationJobType {
  GENERATION_JOB_TYPE_UNSPECIFIED = 0;
  GENERATION_JOB_TYPE_COURSE_OUTLINE = 2;
  GENERATION_JOB_TYPE_LESSON_CONTENT = 3;
  GENERATION_JOB_TYPE_COMPONENT_REGEN = 4;
  GENERATION_JOB_TYPE_FULL_COURSE = 5;
  GENERATION_JOB_TYPE_COURSE_PLANNING = 6;
  GENERATION_JOB_TYPE_COURSE_CREATION = 7;
}

// GenerationJobStatus represents job state.
enum GenerationJobStatus {
  GENERATION_JOB_STATUS_UNSPECIFIED = 0;
  GENERATION_JOB_STATUS_QUEUED = 1;
  GENERATION_JOB_STATUS_PROCESSING = 2;
  GENERATION_JOB_STATUS_COMPLETED = 3;
  GENERATION_JOB_STATUS_FAILED = 4;
  GENERATION_JOB_STATUS_CANCELLED = 5;
  GENERATION_JOB_STATUS_AWAITING_APPROVAL = 6;
  GENERATION_JOB_STATUS_DEFERRED = 7;
}

// OutlineApprovalStatus for generated content review.
enum OutlineApprovalStatus {
  OUTLINE_APPROVAL_STATUS_UNSPECIFIED = 0;
  OUTLINE_APPROVAL_STATUS_PENDING_REVIEW = 1;
  OUTLINE_APPROVAL_STATUS_APPROVED = 2;
  OUTLINE_APPROVAL_STATUS_REJECTED = 3;
  OUTLINE_APPROVAL_STATUS_REVISION_REQUESTED = 4;
}

// GenerationJob represents an AI generation job.
message GenerationJob {
  string id = 1;
  string tenant_id = 2;
  GenerationJobType type = 3;
  GenerationJobStatus status = 4;
  optional string course_id = 5;
  optional string lesson_id = 6;
  int32 progress_percent = 9;
  optional string progress_message = 10;
  optional string result_path = 11;
  optional string error_message = 12;
  int64 tokens_used = 13;
  int32 retry_count = 14;
  int32 max_retries = 15;
  string created_by_user_id = 16;
  google.protobuf.Timestamp created_at = 17;
  optional google.protobuf.Timestamp started_at = 18;
  optional google.protobuf.Timestamp completed_at = 19;
  optional string parent_job_id = 20;
  reserved 21, 22;
}

// CourseOutline represents the generated course structure.
message CourseOutline {
  string id = 1;
  string course_id = 2;
  int32 version = 3;
  repeated OutlineSection sections = 4;
  OutlineApprovalStatus approval_status = 5;
  optional string rejection_reason = 6;
  google.protobuf.Timestamp generated_at = 7;
  optional google.protobuf.Timestamp approved_at = 8;
  optional string approved_by_user_id = 9;
}

// SectionLevel indicates the learning depth of a section.
enum SectionLevel {
  SECTION_LEVEL_UNSPECIFIED = 0;
  SECTION_LEVEL_INTRODUCE = 1;  // First exposure to concepts
  SECTION_LEVEL_DEVELOP = 2;    // Building understanding
  SECTION_LEVEL_MASTER = 3;     // Deep proficiency
}

// SectionIntent indicates the primary purpose of a section.
enum SectionIntent {
  SECTION_INTENT_UNSPECIFIED = 0;
  SECTION_INTENT_TEACH = 1;      // Primary instruction
  SECTION_INTENT_ASSESS = 2;     // Evaluation/testing
  SECTION_INTENT_REINFORCE = 3;  // Practice and reinforcement
}

// SectionEmphasis indicates relative importance of a section.
enum SectionEmphasis {
  SECTION_EMPHASIS_UNSPECIFIED = 0;
  SECTION_EMPHASIS_LOW = 1;
  SECTION_EMPHASIS_MEDIUM = 2;
  SECTION_EMPHASIS_HIGH = 3;
}

// OutlineSection represents a section in the outline.
message OutlineSection {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 order = 4;
  repeated OutlineLesson lessons = 5;
  bool is_first_section = 6;
  bool is_last_section = 7;

  // Section metadata for curriculum planning
  repeated string mapped_outcome_ids = 10;     // IDs of outcomes this section addresses
  SectionLevel level = 11;                      // Learning level (introduce/develop/master)
  SectionIntent intent = 12;                    // Primary intent (teach/assess/reinforce)
  SectionEmphasis emphasis = 13;                // Relative importance
  float grounding_score = 14;                   // How grounded in knowledge sources (0.0-1.0)
  repeated string contributing_chunk_ids = 15; // IDs of RAG chunks that informed this section
}

// OutlineLesson represents a lesson in the outline.
message OutlineLesson {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 order = 4;
  int32 estimated_duration_minutes = 5;
  repeated string learning_objectives = 6;
  bool is_first_in_section = 7;
  bool is_last_in_section = 8;
  bool is_first_in_course = 9;
  bool is_last_in_course = 10;
  // Citations from knowledge sources used to inform this lesson
  repeated KnowledgeCitation citations = 11;
  // How grounded in knowledge sources (0.0-1.0)
  float grounding_score = 12;
}

// GeneratedLesson contains full lesson content.
message GeneratedLesson {
  string id = 1;
  string course_id = 2;
  string section_id = 3;
  string outline_lesson_id = 4;
  string title = 5;
  repeated LessonComponent components = 6;
  optional string segue_text = 7;
  google.protobuf.Timestamp generated_at = 8;

  // Provenance tracking
  float grounding_score = 9;        // Aggregate grounding across components (0.0-1.0)
  int32 source_count = 10;          // Number of knowledge sources used
  int32 grounded_token_count = 11;  // Tokens from knowledge sources
  int32 total_token_count = 12;     // Total tokens in lesson
  optional LessonProvenance aggregate_provenance = 13;
}

// LessonComponent represents a content component in a lesson.
message LessonComponent {
  string id = 1;
  LessonComponentType type = 2;
  int32 order = 3;
  string content_json = 4;  // JSON string matching component_content.proto types
  optional ComponentAlignment alignment = 5;
  optional ComponentProvenance provenance = 6;
  bool validated = 7;  // User has reviewed and validated this AI-generated component
}

// ComponentAlignment tracks what knowledge/objectives a component addresses.
message ComponentAlignment {
  repeated string learning_objective_ids = 2;
}

// SourceType identifies the origin of generated content.
enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_INTERNAL_KNOWLEDGE = 1;  // RAG from vector store
  SOURCE_TYPE_WEB_SEARCH = 2;          // Google grounding / web
  SOURCE_TYPE_MODEL = 3;               // Pure AI generation
}

// AnnotatedParagraph holds a single HTML paragraph with source attribution indices.
message AnnotatedParagraph {
  string html = 1;                    // One <p>...</p> block
  repeated int32 source_indices = 2;  // References into parent's source_chunks
}

// ComponentProvenance tracks which knowledge sources contributed to a component.
message ComponentProvenance {
  repeated ProvenanceChunk source_chunks = 1;
  repeated string queries = 2;
  int32 team_tokens = 3;
  int32 global_tokens = 4;
  int32 course_tokens = 5;
  int32 total_tokens = 6;
  google.protobuf.Timestamp generated_at = 7;
  SourceType dominant_source_type = 8;
  repeated AnnotatedParagraph paragraphs = 9;  // Only for text components
  string model_name = 10;                       // e.g., "gemini-2.5-flash"
  string generation_context = 11;               // Learning objective / context summary
}

// ProvenanceChunk represents a knowledge chunk that contributed to generated content.
message ProvenanceChunk {
  string chunk_id = 1;
  string source_id = 2;
  string source_name = 3;
  string excerpt = 4;
  float similarity_score = 5;
  string scope = 6;           // "course", "team", "global"
  SourceType source_type = 7;
  string url = 8;             // For web sources
  string page_title = 9;      // For web sources
  string team_id = 10;        // For internal knowledge
  string team_name = 11;      // For internal knowledge
}

// LessonProvenance aggregates provenance across all components in a lesson.
message LessonProvenance {
  float grounding_score = 1;
  int32 team_tokens = 2;
  int32 global_tokens = 3;
  int32 course_tokens = 4;
  int32 ungrounded_tokens = 5;
  int32 total_tokens = 6;
  int32 source_count = 7;
}

// ComponentAlignmentTargets for content regeneration alignment.
message ComponentAlignmentTargets {
  repeated string persona_ids = 1;
  repeated string learning_objective_ids = 2;
}

// CourseGenerationInput captures inputs for AI course generation.
message CourseGenerationInput {
  string course_id = 1;
  string desired_outcome = 4;
  optional string additional_context = 5;
}

// =============================================================================
// COURSE PLAN - Knowledge-grounded planning pipeline
// =============================================================================

// CoursePlan is the AI-generated course structure plan based on document analysis.
message CoursePlan {
  repeated DocumentAnalysis document_analyses = 1;
  repeated PlannedSection planned_sections = 2;
  string status = 3; // "pending_review", "approved"
  google.protobuf.Timestamp generated_at = 4;
  optional google.protobuf.Timestamp approved_at = 5;
  int64 tokens_used = 6;
}

// DocumentAnalysis is Gemini's structured summary of one knowledge source.
message DocumentAnalysis {
  string source_id = 1;
  string source_name = 2;
  string summary = 3;
  repeated string main_topics = 4;
  repeated string key_facts = 5;
  string content_depth = 6;
  repeated SectionHint section_hints = 7;
}

// SectionHint is a suggested course section derived from analyzing a document.
message SectionHint {
  string topic_name = 1;
  repeated string search_terms = 2;
  repeated string key_points = 3;
}

// PlannedSection is a planned course section with targeted RAG search terms.
message PlannedSection {
  string title = 1;
  string description = 2;
  repeated string search_terms = 3;
  repeated string source_ids = 4;
  repeated PlannedLesson lessons = 5;
  string rationale = 6;
}

// PlannedLesson is a planned lesson with its own search terms for targeted RAG.
message PlannedLesson {
  string title = 1;
  string description = 2;
  repeated string search_terms = 3;
  repeated string learning_goals = 4;
}

// =============================================================================
// UNIFIED COURSE CREATION WORKFLOW (Phase 7)
// =============================================================================

// WorkflowStepType identifies which step the workflow is waiting for approval on.
// 5-step instructional design wizard with validated Pydantic artifacts at each gate.
enum WorkflowStepType {
  WORKFLOW_STEP_TYPE_UNSPECIFIED = 0;
  WORKFLOW_STEP_TYPE_INTENT_ANALYSIS = 1;    // Step 1: Define intent → CourseAnalysis
  WORKFLOW_STEP_TYPE_DEFINE_SUCCESS = 2;      // Step 2: Define success → CourseOutcomes
  WORKFLOW_STEP_TYPE_APPROVE_STRUCTURE = 3;   // Step 3: Approve structure → CourseStructure
  WORKFLOW_STEP_TYPE_SAMPLE_LESSON = 4;       // Step 4: Approve sample lesson → Lesson pattern
  WORKFLOW_STEP_TYPE_FINAL_REVIEW = 5;        // Step 5: Final QA review → ExportPackage (legacy)
  WORKFLOW_STEP_TYPE_COMBINED_REVIEW = 6;     // Combined review: all artifacts in tabbed view
}
