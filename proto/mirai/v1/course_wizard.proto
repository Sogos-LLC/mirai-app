syntax = "proto3";

package mirai.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ToneDetailLevel controls content depth and verbosity.
enum ToneDetailLevel {
  TONE_DETAIL_LEVEL_UNSPECIFIED = 0;
  TONE_DETAIL_LEVEL_BRIEF = 1;
  TONE_DETAIL_LEVEL_MODERATE = 2;
  TONE_DETAIL_LEVEL_COMPREHENSIVE = 3;
}

// SMEPersona represents a Subject Matter Expert persona for the wizard.
// Generated by AI based on course topic to guide content voice and expertise.
message SMEPersona {
  string id = 1;
  string job_title = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3 [(buf.validate.field).string.min_len = 1];
  repeated string skills = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
  string voice = 5 [(buf.validate.field).string.min_len = 1];
}

// AudiencePersona represents a target learner profile.
// Generated by AI to help tailor content to specific audience needs.
message AudiencePersona {
  string id = 1;
  reserved 2;
  reserved "name";
  string role = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4 [(buf.validate.field).string.min_len = 1];
  repeated string goals = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

// ToneOption represents a tone/style option for the course.
// Generated by AI to offer different content delivery styles.
message ToneOption {
  string id = 1;
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3 [(buf.validate.field).string.min_len = 1];
  ToneDetailLevel level_of_detail = 4 [(buf.validate.field).enum.defined_only = true];
}

// WizardStepData holds all wizard state data for persistence.
message WizardStepData {
  string course_name = 1;
  string improved_title = 2;
  string description = 3;
  repeated SMEPersona sme_personas = 4;
  repeated string selected_sme_ids = 5;
  repeated AudiencePersona audience_personas = 6;
  repeated string selected_audience_ids = 7;
  repeated ToneOption tone_options = 8;
  string selected_tone_id = 9;
  string additional_context = 10;
  string desired_outcomes = 11; // Course outcomes - the "north star" for all content generation

  // Internal Data Only mode: When enabled, course content is generated
  // exclusively from uploaded knowledge sources. AI will not add external
  // information or fill gaps - course size adapts to available content.
  bool internal_data_only = 12;

  // Knowledge selection (Step 1) - Selected knowledge sources for RAG
  repeated string selected_team_doc_ids = 15;    // Selected team-level knowledge source IDs
  repeated string selected_global_doc_ids = 16;  // Selected global (tenant-level) knowledge source IDs
  int64 estimated_team_tokens = 17;              // Estimated tokens from team sources
  int64 estimated_global_tokens = 18;            // Estimated tokens from global sources
}

// WizardState tracks wizard progress for resume capability.
message WizardState {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string current_step = 4; // courseName, titleDescription, smeSelection, etc.
  WizardStepData data = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// CourseWizardService handles the 7-step course creation wizard.
service CourseWizardService {
  // GenerateTitle improves the course name and generates a description.
  // Step 1 -> 2: User enters course name, AI generates improved title + description.
  rpc GenerateTitle(GenerateTitleRequest) returns (GenerateTitleResponse);

  // GenerateOutcomes generates course outcomes from the course name.
  // Used by the "magic wand" button in Step 1 to auto-generate desired outcomes.
  rpc GenerateOutcomes(GenerateOutcomesRequest) returns (GenerateOutcomesResponse);

  // GenerateSMEPersonas generates 3 diverse SME personas based on course topic.
  // Step 2 -> 3: AI generates SME options for user to select/edit.
  rpc GenerateSMEPersonas(GenerateSMEPersonasRequest) returns (GenerateSMEPersonasResponse);

  // GenerateAudiencePersonas generates 3 diverse audience personas.
  // Step 3 -> 4: AI generates audience options for user to select/edit.
  rpc GenerateAudiencePersonas(GenerateAudiencePersonasRequest) returns (GenerateAudiencePersonasResponse);

  // GenerateToneOptions generates 3 tone/style options for the course.
  // Step 4 -> 5: AI generates tone options for user to select.
  rpc GenerateToneOptions(GenerateToneOptionsRequest) returns (GenerateToneOptionsResponse);

  // SaveWizardState persists wizard progress for later resume.
  rpc SaveWizardState(SaveWizardStateRequest) returns (SaveWizardStateResponse);

  // GetWizardState retrieves saved wizard progress.
  rpc GetWizardState(GetWizardStateRequest) returns (GetWizardStateResponse);

  // DeleteWizardState clears wizard state after completion or cancellation.
  rpc DeleteWizardState(DeleteWizardStateRequest) returns (DeleteWizardStateResponse);

  // CreateCourseFromOutline creates a course record after outline approval.
  // This is called after the outline is approved to persist the course.
  rpc CreateCourseFromOutline(CreateCourseFromOutlineRequest) returns (CreateCourseFromOutlineResponse);
}

// GenerateTitleRequest contains the user's initial course name.
message GenerateTitleRequest {
  string course_name = 1 [(buf.validate.field).string.min_len = 1];
  // Selected knowledge sources for RAG context
  repeated string selected_team_doc_ids = 2;
  repeated string selected_global_doc_ids = 3;
}

// GenerateTitleResponse contains the AI-improved title and description.
message GenerateTitleResponse {
  string improved_title = 1;
  string description = 2;
}

// GenerateOutcomesRequest contains the course name for outcome generation.
message GenerateOutcomesRequest {
  string course_name = 1 [(buf.validate.field).string.min_len = 1];
  // Optional session ID for RAG context from uploaded knowledge sources
  optional string session_id = 2;
  // Selected knowledge sources for RAG context
  repeated string selected_team_doc_ids = 3;
  repeated string selected_global_doc_ids = 4;
}

// GenerateOutcomesResponse contains AI-generated course outcomes.
message GenerateOutcomesResponse {
  string outcomes = 1; // Freeform text with bullet points describing what learners will achieve
  // Citations from knowledge sources used to generate outcomes
  repeated KnowledgeCitation citations = 2;
  // Grounding metrics showing how much content is traceable to knowledge sources
  GroundingInfo grounding = 3;
}

// KnowledgeCitation represents a reference to a knowledge source used in generation.
message KnowledgeCitation {
  string source_id = 1;
  string source_name = 2;
  string excerpt = 3; // Relevant excerpt from the source
  float relevance_score = 4;
}

// GroundingInfo contains metrics about content grounding in knowledge sources.
message GroundingInfo {
  float score = 1;            // 0.0 - 1.0, ratio of grounded to total tokens
  int32 course_tokens = 2;    // Tokens from course-specific knowledge
  int32 team_tokens = 3;      // Tokens from team knowledge sources
  int32 global_tokens = 4;    // Tokens from global (tenant-wide) knowledge
  int32 ungrounded_tokens = 5; // Tokens not traceable to knowledge sources
  int32 total_tokens = 6;     // Total token count
  int32 source_count = 7;     // Number of unique knowledge sources used
  string level = 8;           // "high", "moderate", "low", "minimal"
}

// GenerateSMEPersonasRequest contains context for SME generation.
message GenerateSMEPersonasRequest {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2 [(buf.validate.field).string.min_len = 1];
  // Selected knowledge sources for RAG context
  repeated string selected_team_doc_ids = 3;
  repeated string selected_global_doc_ids = 4;
}

// GenerateSMEPersonasResponse contains 3 diverse SME personas.
message GenerateSMEPersonasResponse {
  repeated SMEPersona personas = 1;
}

// GenerateAudiencePersonasRequest contains context for audience generation.
message GenerateAudiencePersonasRequest {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2 [(buf.validate.field).string.min_len = 1];
  repeated SMEPersona selected_smes = 3;
  // Selected knowledge sources for RAG context
  repeated string selected_team_doc_ids = 4;
  repeated string selected_global_doc_ids = 5;
}

// GenerateAudiencePersonasResponse contains 3 diverse audience personas.
message GenerateAudiencePersonasResponse {
  repeated AudiencePersona personas = 1;
}

// GenerateToneOptionsRequest contains context for tone generation.
message GenerateToneOptionsRequest {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2 [(buf.validate.field).string.min_len = 1];
  repeated AudiencePersona selected_audiences = 3;
  // Selected knowledge sources for RAG context
  repeated string selected_team_doc_ids = 4;
  repeated string selected_global_doc_ids = 5;
}

// GenerateToneOptionsResponse contains 3 tone options.
message GenerateToneOptionsResponse {
  repeated ToneOption options = 1;
}

// SaveWizardStateRequest contains wizard state to persist.
message SaveWizardStateRequest {
  string current_step = 1 [(buf.validate.field).string.min_len = 1];
  WizardStepData data = 2;
}

// SaveWizardStateResponse confirms state was saved.
message SaveWizardStateResponse {
  WizardState state = 1;
}

// GetWizardStateRequest retrieves wizard state for the current user.
message GetWizardStateRequest {
  // No parameters needed - uses authenticated user context
}

// GetWizardStateResponse contains the saved wizard state.
message GetWizardStateResponse {
  optional WizardState state = 1; // null if no saved state exists
}

// DeleteWizardStateRequest clears wizard state.
message DeleteWizardStateRequest {
  // No parameters needed - uses authenticated user context
}

// DeleteWizardStateResponse confirms deletion.
message DeleteWizardStateResponse {
  bool success = 1;
}

// CreateCourseFromOutlineRequest creates a course from an approved outline.
message CreateCourseFromOutlineRequest {
  string course_id = 1 [(buf.validate.field).string.min_len = 1];
  // Wizard data to store with the course
  WizardStepData wizard_data = 2;
}

// CreateCourseFromOutlineResponse contains the created course.
message CreateCourseFromOutlineResponse {
  string course_id = 1;
  string course_title = 2;
}
