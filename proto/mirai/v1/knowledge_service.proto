syntax = "proto3";

package mirai.v1;

import "buf/validate/validate.proto";
import "mirai/v1/knowledge_source.proto";

// =============================================================================
// KNOWLEDGE SOURCE SERVICE - RPC definitions for knowledge source operations
// =============================================================================
//
// To regenerate after changes: cd proto && buf generate
// =============================================================================

// KnowledgeSourceService handles knowledge source operations for RAG.
service KnowledgeSourceService {
  // GetUploadURL returns a presigned URL for file upload to MinIO.
  rpc GetUploadURL(GetUploadURLRequest) returns (GetUploadURLResponse);

  // CreateKnowledgeSource registers a new source and initiates ingestion.
  rpc CreateKnowledgeSource(CreateKnowledgeSourceRequest) returns (CreateKnowledgeSourceResponse);

  // ListKnowledgeSources returns all sources for a course.
  rpc ListKnowledgeSources(ListKnowledgeSourcesRequest) returns (ListKnowledgeSourcesResponse);

  // GetKnowledgeSource returns a single source by ID.
  rpc GetKnowledgeSource(GetKnowledgeSourceRequest) returns (GetKnowledgeSourceResponse);

  // DeleteKnowledgeSource removes a source and its chunks from vector store.
  rpc DeleteKnowledgeSource(DeleteKnowledgeSourceRequest) returns (DeleteKnowledgeSourceResponse);

  // SearchKnowledge performs semantic search across course knowledge.
  rpc SearchKnowledge(SearchKnowledgeRequest) returns (SearchKnowledgeResponse);
}

// GetUploadURLRequest for presigned upload URL.
message GetUploadURLRequest {
  string course_id = 1 [(buf.validate.field).string.uuid = true];
  string filename = 2 [(buf.validate.field).string.min_len = 1];
  string content_type = 3 [(buf.validate.field).string.min_len = 1];
}

message GetUploadURLResponse {
  string upload_url = 1;    // Presigned PUT URL
  string file_path = 2;     // MinIO path to use when creating source
}

// CreateKnowledgeSourceRequest to register a new source after upload.
message CreateKnowledgeSourceRequest {
  string course_id = 1 [(buf.validate.field).string.uuid = true];
  KnowledgeSourceType type = 2;
  string name = 3 [(buf.validate.field).string.min_len = 1];
  string file_path = 4 [(buf.validate.field).string.min_len = 1];
  string mime_type = 5;
  int64 file_size_bytes = 6;
}

message CreateKnowledgeSourceResponse {
  KnowledgeSource source = 1;
}

// ListKnowledgeSourcesRequest for listing course sources.
message ListKnowledgeSourcesRequest {
  string course_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListKnowledgeSourcesResponse {
  repeated KnowledgeSource sources = 1;
}

// GetKnowledgeSourceRequest for single source.
message GetKnowledgeSourceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetKnowledgeSourceResponse {
  KnowledgeSource source = 1;
}

// DeleteKnowledgeSourceRequest to remove a source.
message DeleteKnowledgeSourceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteKnowledgeSourceResponse {
  bool success = 1;
}

// SearchKnowledgeRequest for semantic search.
message SearchKnowledgeRequest {
  string course_id = 1 [(buf.validate.field).string.uuid = true];
  string query = 2 [(buf.validate.field).string.min_len = 1];
  int32 top_k = 3;  // Number of results (default 5, max 20)
}

message SearchKnowledgeResponse {
  repeated RetrievedChunk chunks = 1;
}
