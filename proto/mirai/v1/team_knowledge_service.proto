syntax = "proto3";

package mirai.v1;

import "buf/validate/validate.proto";
import "mirai/v1/knowledge_source.proto";

// =============================================================================
// KNOWLEDGE SERVICE - RPC definitions for global and team-level knowledge
// =============================================================================
//
// Knowledge sources can be scoped at two levels:
// 1. Global Knowledge (team_id omitted) - Shared across entire tenant
// 2. Team Knowledge (team_id provided) - Shared within a specific team
//
// Both levels are used during RAG-powered course generation.
//
// To regenerate after changes: cd proto && buf generate
// =============================================================================

// TeamKnowledgeService handles global and team-level knowledge source operations.
service TeamKnowledgeService {
  // UploadTeamKnowledge uploads a file and processes it for RAG.
  // If team_id is omitted, creates global knowledge (tenant-level).
  // If team_id is provided, creates team-specific knowledge.
  rpc UploadTeamKnowledge(UploadTeamKnowledgeRequest) returns (UploadTeamKnowledgeResponse);

  // ListTeamKnowledgeSources returns knowledge sources.
  // If team_id is omitted, returns global knowledge (tenant-level).
  // If team_id is provided, returns team-specific knowledge.
  rpc ListTeamKnowledgeSources(ListTeamKnowledgeSourcesRequest) returns (ListTeamKnowledgeSourcesResponse);

  // GetTeamKnowledgeSource returns a single knowledge source by ID.
  rpc GetTeamKnowledgeSource(GetTeamKnowledgeSourceRequest) returns (GetTeamKnowledgeSourceResponse);

  // DeleteTeamKnowledgeSource removes a knowledge source and its vectors.
  rpc DeleteTeamKnowledgeSource(DeleteTeamKnowledgeSourceRequest) returns (DeleteTeamKnowledgeSourceResponse);

  // SearchTeamKnowledge performs semantic search across knowledge.
  // If team_id is omitted, searches global knowledge.
  // If team_id is provided, searches team-specific knowledge.
  rpc SearchTeamKnowledge(SearchTeamKnowledgeRequest) returns (SearchTeamKnowledgeResponse);

  // CheckDuplicateKnowledge checks if a file with the same content hash already exists.
  // Used before upload to warn users about duplicate files.
  rpc CheckDuplicateKnowledge(CheckDuplicateKnowledgeRequest) returns (CheckDuplicateKnowledgeResponse);
}

// UploadTeamKnowledgeRequest for uploading a file to knowledge base.
message UploadTeamKnowledgeRequest {
  // Filename for display and MIME type detection
  string filename = 1 [(buf.validate.field).string.min_len = 1];

  // Content type (e.g., "text/plain", "text/markdown")
  string content_type = 2 [(buf.validate.field).string.min_len = 1];

  // File content as bytes
  bytes file_content = 3 [(buf.validate.field).bytes.min_len = 1];

  // Optional team ID. If omitted, creates global knowledge (tenant-level).
  // If provided, creates team-specific knowledge.
  optional string team_id = 4;

  // SHA-256 hash of file content for duplicate detection (hex string, 64 chars)
  string content_hash = 5 [(buf.validate.field).string.len = 64];
}

message UploadTeamKnowledgeResponse {
  // The created knowledge source
  KnowledgeSource source = 1;

  // AI-generated summary of the document
  string rag_summary = 2;
}

// ListTeamKnowledgeSourcesRequest for listing knowledge sources.
message ListTeamKnowledgeSourcesRequest {
  // Optional team ID. If omitted, lists global knowledge (tenant-level).
  // If provided, lists team-specific knowledge.
  optional string team_id = 1;
}

message ListTeamKnowledgeSourcesResponse {
  // Knowledge sources for the specified scope
  repeated KnowledgeSource sources = 1;

  // Total number of sources
  int32 total_sources = 2;

  // Total tokens across all ready sources
  int64 total_tokens = 3;
}

// GetTeamKnowledgeSourceRequest for fetching a single source.
message GetTeamKnowledgeSourceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetTeamKnowledgeSourceResponse {
  KnowledgeSource source = 1;
}

// DeleteTeamKnowledgeSourceRequest to remove a source.
message DeleteTeamKnowledgeSourceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteTeamKnowledgeSourceResponse {
  bool success = 1;
}

// SearchTeamKnowledgeRequest for semantic search across knowledge.
message SearchTeamKnowledgeRequest {
  // Search query
  string query = 1 [(buf.validate.field).string.min_len = 1];

  // Number of results to return (default 5, max 20)
  int32 top_k = 2;

  // Optional team ID. If omitted, searches global knowledge.
  // If provided, searches team-specific knowledge.
  optional string team_id = 3;
}

message SearchTeamKnowledgeResponse {
  // Retrieved chunks with similarity scores
  repeated RetrievedChunk chunks = 1;
}

// CheckDuplicateKnowledgeRequest to check for existing files with same content.
message CheckDuplicateKnowledgeRequest {
  // SHA-256 hash of file content (hex string, 64 chars)
  string content_hash = 1 [(buf.validate.field).string.len = 64];
}

message CheckDuplicateKnowledgeResponse {
  // Whether a duplicate exists
  bool exists = 1;

  // If duplicate exists, the existing source info
  KnowledgeSource existing_source = 2;

  // Human-readable location of the duplicate (e.g., "Global Knowledge" or "Team: Engineering")
  string location = 3;
}
