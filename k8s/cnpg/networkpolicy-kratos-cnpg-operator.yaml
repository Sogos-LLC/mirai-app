# NetworkPolicy to allow CNPG operator (from cnpg-system namespace) to reach Kratos database pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-cnpg-operator
  namespace: kratos
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: kratos-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 5432
