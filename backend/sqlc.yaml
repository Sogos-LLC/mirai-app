version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "gen"
        out: "internal/database/gen"
        sql_package: "database/sql"
        emit_db_tags: true
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # UUID handling - google/uuid
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          # Nullable UUID
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"

          # Array types - lib/pq compatible
          - db_type: "text[]"
            go_type:
              import: "github.com/lib/pq"
              type: "StringArray"

          # Timestamps
          - db_type: "timestamptz"
            go_type: "time.Time"

          - db_type: "timestamptz"
            nullable: true
            go_type: "*time.Time"
